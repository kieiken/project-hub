<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <button class="tb menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="list" title="プロジェクトの一覧を出す・しまう" data-ui>☰</button>
  <h1>Project Hub</h1>
  <button class="ver" id="ver" type="button" title="変更の記録を見る" data-ui></button>
  <button class="tb upd" id="upd" type="button" hidden></button>
  <span class="sp"></span>
  <button class="tb usage-toggle" id="usage-toggle" type="button" aria-expanded="false" aria-controls="usage-drawer" title="利用枠の使用率とリセット時期を見る" data-ui>利用状況</button>
  <button class="tb turn" id="turn" type="button" aria-pressed="false" data-ui>あなたの番 <span class="n" id="turn-n" data-ui>返事待ち 0</span><span class="notice notice-confirm" id="turn-done-n" data-ui>完了確認 0</span></button>
  <button class="tb" id="gear" type="button" aria-pressed="false" data-ui>設定</button>
</header>

<div class="mobile-information"><button id="mobile-info" class="mobile-strip" type="button" aria-label="情報と操作を開く" aria-expanded="false" aria-controls="mobile-work-info" data-ui>▼</button><span id="mobile-badges"></span></div>
<div class="app">
  <nav class="list" id="list" aria-label="プロジェクトと作業" data-ui></nav>
  <div class="sidebar-resize" id="sidebar-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="list" aria-valuemin="180" aria-valuemax="480" aria-valuenow="240" aria-label="プロジェクト一覧の幅を調整" title="ドラッグまたは左右キーで一覧の幅を調整" data-ui></div>
  <main class="main" id="main"></main>
</div>

<aside class="drawer usage-drawer" id="usage-drawer" hidden role="dialog" aria-labelledby="usage-title">
  <div class="dh"><h2 id="usage-title" data-ui>AIの利用状況</h2><button class="x" id="usage-close" type="button" aria-label="利用状況を閉じる" data-ui>×</button></div>
  <p class="note usage-explanation" data-ui>契約の利用枠に対する使用率です。トークン数や、この会話の長さとは別です。</p>
  <div class="row"><button class="btn plain" id="usage-refresh" type="button" data-ui>今の状況を確認</button><span class="small" id="usage-status" role="status"></span></div>
  <div id="usage-body"></div>
  <p class="note usage-explanation" data-ui>通常は5分ごとに取得します。日時はこの端末の時刻です。取得に失敗した場合は、自動で繰り返さず［今の状況を確認］から再確認できます。</p>
</aside>
<aside class="drawer maintenance-drawer" id="maintenance-drawer" hidden role="dialog" aria-labelledby="maintenance-title"><div class="dh"><h2 id="maintenance-title" data-ui>整理と確認</h2><button class="x" id="maintenance-close" type="button" aria-label="整理と検証を閉じる" data-ui>×</button></div><div id="maintenance-body"></div></aside>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="toast" id="toast" hidden></div>
<script src="locale-config.js"></script>
<script src="locale.js"></script>
<script src="sidebar-resize.js"></script>
<script src="project-order.js"></script>
<script src="chat-scroll.js"></script>
<script src="mobile.js"></script>
<script src="model-order.js"></script>
<script src="app.js"></script>
<script src="app-update.js"></script>
<script src="session-links.js"></script>
<script src="hierarchy.js"></script>
<script src="remove.js"></script>
<script src="github.js"></script>
<script src="task-transfer.js"></script>
<script src="task-integrate.js"></script>
<script src="maintenance.js"></script>
<script src="usage.js"></script>
</body>
</html>
