<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<script src="local-auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="apple-touch-icon" href="icon.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ideas.css">
</head>
<body>
<header class="bar">
  <button class="tb menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="list" title="プロジェクトの一覧を出す・しまう" data-ui>☰</button>
  <h1>Project Hub</h1>
  <span class="master-badge" id="master-badge" hidden title="製作者版（Master）" aria-label="製作者版（Master）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 6 5 4 4-7 4 7 5-4-3 12H6Z"/><path d="M6 21h12"/></svg><span>Master</span></span>
  <button class="ver" id="ver" type="button" title="変更の記録を見る" data-ui></button>
  <button class="tb upd" id="upd" type="button" hidden></button>
  <span class="sp"></span>
  <button class="tb usage-toggle" id="usage-toggle" type="button" aria-expanded="false" aria-controls="usage-drawer" title="利用枠の使用率とリセット時期を見る" data-ui>利用状況</button>
  <button class="tb turn" id="turn" type="button" aria-pressed="false" data-ui><span class="notice notice-reply" id="turn-n" data-ui>返事待ち 0</span><span class="notice notice-work" id="turn-work-n" data-ui>作業中 0</span><span class="notice notice-results" id="turn-results-n" data-ui>成果確認 0</span><span class="notice notice-confirm" id="turn-done-n" data-ui>完了 0</span></button>
  <button class="tb" id="gear" type="button" aria-pressed="false" data-ui>設定</button>
</header>
<div id="app-shell-alert" class="app-shell-alert" hidden aria-live="polite"></div>
<template id="conversation-search-sidebar-template">
  <form id="conversation-search-form" class="conversation-search-sidebar" role="search" aria-label="会話を検索">
    <input id="conversation-search-query" type="search" maxlength="200" autocomplete="off" placeholder="🔍 会話を検索" aria-label="会話の検索語" data-ui>
    <div class="row"><select id="conversation-search-mode" aria-label="検索範囲" data-ui><option value="simple" data-ui>簡易</option><option value="detailed" data-ui>詳細</option></select><button class="btn sm" type="submit" data-ui>検索</button></div>
  </form>
</template>
<template id="conversation-search-template">
<section id="conversation-search" class="conversation-search view" aria-labelledby="conversation-search-title">
  <div class="ph"><h2 id="conversation-search-title" data-ui>会話の検索結果</h2><button class="btn plain sm" id="conversation-search-close" type="button" data-ui>前の画面へ</button><button class="btn plain sm" id="conversation-search-stop" type="button" hidden data-ui>中断</button></div>
  <p id="conversation-search-scope" class="small"></p>
  <p class="small" data-ui>語句・全部の語が一致する候補を優先し、一部の語だけが一致するものは関連候補として表示します。意味や同義語を推測する検索ではありません。</p>
  <details><summary data-ui>検索の範囲と上限</summary><p class="small" data-ui>フリートークと全プロジェクト・子プロジェクト・完了作業の会話本文をローカルで検索します。過去とは整理して正式保管した会話です。認証ファイル・添付内容・CLI生ログ・ゴミ箱・未検証の保管物は対象外です。フリートーク整理でゴミ箱へ移した原文は検索しません。両モードとも1ファイル64MiB・合計512MiB・1万ファイル・候補1000件・120秒まで。更新中や検証できない範囲は件数でお知らせします。</p></details>
  <p id="conversation-search-status" role="status" aria-live="polite" data-ui>検索語を入力してください。</p>
  <div id="conversation-search-results" class="conversation-search-scroll"><div id="conversation-search-list"></div><button class="btn plain" id="conversation-search-more" type="button" hidden data-ui>続きを表示</button></div>
  <section id="conversation-search-context" class="conversation-search-scroll" hidden aria-label="該当発言と前後の会話"><button class="btn plain" id="conversation-search-back" type="button" data-ui>← 検索結果へ戻る</button><h3 id="conversation-search-location"></h3><p class="small" data-ui>読み取り専用です。この表示では作業を既読にせず、下書きや添付も変更しません。</p><div id="conversation-search-rows"></div></section>
</section>
</template>

<div class="mobile-information"><button id="mobile-info" class="mobile-strip" type="button" aria-label="情報と操作を開く" aria-expanded="false" aria-controls="mobile-work-info" data-ui>▼</button><span id="mobile-badges"></span></div>
<div class="app">
  <nav class="list" id="list" aria-label="プロジェクトと作業" data-ui></nav>
  <div class="sidebar-resize" id="sidebar-resize" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="list" aria-valuemin="180" aria-valuemax="480" aria-valuenow="240" aria-label="プロジェクト一覧の幅を調整" title="ドラッグまたは左右キーで一覧の幅を調整" data-ui></div>
  <main class="main" id="main"></main>
</div>

<aside class="drawer usage-drawer" id="usage-drawer" hidden role="dialog" aria-labelledby="usage-title">
  <div class="dh"><h2 id="usage-title" data-ui>AIの利用状況</h2><button class="x" id="usage-close" type="button" aria-label="利用状況を閉じる" data-ui>×</button></div>
  <p class="note usage-explanation" data-ui>契約の利用枠に対する使用率です。トークン数や、この会話の長さとは別です。</p>
  <div class="row"><button class="btn plain" id="usage-refresh" type="button" data-ui>今の状況を確認</button><span class="small" id="usage-status" role="status"></span></div>
  <div id="usage-body"></div>
  <p class="note usage-explanation" data-ui>通常は5分ごとに取得します。日時はこの端末の時刻です。取得に失敗した場合は、自動で繰り返さず［今の状況を確認］から再確認できます。</p>
</aside>
<aside class="drawer maintenance-drawer" id="maintenance-drawer" hidden role="dialog" aria-labelledby="maintenance-title"><div class="dh"><h2 id="maintenance-title" data-ui>整理と確認</h2><button class="x" id="maintenance-close" type="button" aria-label="整理と検証を閉じる" data-ui>×</button></div><div id="maintenance-body"></div></aside>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="toast" id="toast" hidden></div>
<script src="locale-config.js"></script>
<script src="locale.js"></script>
<script src="sidebar-resize.js"></script>
<script src="project-order.js"></script>
<script src="chat-scroll.js"></script>
<script src="chat-history.js"></script>
<script src="mobile.js"></script>
<script src="model-order.js"></script>
<script src="special-mode.js"></script>
<script src="role-settings.js"></script>
<script src="speech-input.js"></script>
<script src="ideas.js"></script>
<link rel="stylesheet" href="extensions-ui.css">
<script src="extensions-ui.js"></script>
<script src="app-tree.js"></script>
<script src="app-project.js"></script>
<script src="app-freetalk.js"></script>
<script src="app-work.js"></script>
<script src="app-composer.js"></script>
<script src="app-messages.js"></script>
<script src="app-files.js"></script>
<script src="app-chat.js"></script>
<script src="app-terminal.js"></script>
<script src="app-settings-ai.js"></script>
<script src="app-settings.js"></script>
<script src="app-actions.js"></script>
<script src="app.js"></script>
<script src="conversation-search.js"></script>
<script src="app-update.js"></script>
<script src="onboarding.js"></script>
<script src="hierarchy.js"></script>
<script src="remove.js"></script>
<script src="github.js"></script>
<script src="task-transfer.js"></script>
<script src="integration-selection.js"></script>
<script src="task-integrate.js"></script>
<script src="task-history.js"></script>
<script src="maintenance.js"></script>
<script src="usage.js"></script>
</body>
</html>
